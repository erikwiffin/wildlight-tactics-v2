<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wildlight Storybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: the game's grid (score, queue, board, unit card) floats as paper cut-outs over a golden-hour sky. */
:root {
  --ink: #3b2618;
  --ink-soft: rgba(59, 38, 24, 0.55);
  --paper: #f8ecd2;
  --paper-2: #efdbb3;
  --blue: #3f87cc;
  --blue-wash: #cfe2f2;
  --orange: #e46f2a;
  --orange-wash: #f8d9be;
  --gold: #f0b23a;
  --leaf: #5f9e45;
  --sky-1: #93b5dc;
  --sky-2: #cdb6d6;
  --sky-3: #f6c59a;
  --sky-4: #f3a46b;
  --display: 'Grandstander', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  color: var(--ink);
  font: 15px/1.35 var(--body);
  background:
    radial-gradient(60% 40% at 18% 78%, rgba(255, 226, 160, 0.75), transparent 70%),
    linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 72%, var(--sky-4) 100%);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.game {
  height: 100%;
  display: grid;
  grid-template-columns: 100%;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: 'top' 'queue' 'board' 'panel';
  gap: 6px;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}

/* Paper cut-out: the deckled, inked edge lives on a filtered layer behind crisp text. */
.paper { position: relative; isolation: isolate; }
.paper::before {
  content: ''; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(circle at 22% 28%, rgba(255, 252, 240, 0.9), transparent 55%),
    radial-gradient(circle at 80% 90%, rgba(214, 180, 124, 0.35), transparent 60%),
    linear-gradient(170deg, var(--paper), var(--paper-2));
  border: 2px solid var(--ink);
  border-radius: 14px 18px 12px 16px / 16px 12px 18px 14px;
  box-shadow: 3px 4px 0 rgba(59, 38, 24, 0.22);
  filter: url(#deckle);
}

/* Score bar */
.top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 6px 14px; }
.side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.side.t1 { align-items: flex-end; }
.side .row { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); font-weight: 800; }
.side .who { font-size: 13px; letter-spacing: 0.04em; }
.side .pts { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; display: inline-block; }
.side .pts small { font-size: 12px; opacity: 0.6; }
.side.t0 .row { color: var(--blue); }
.side.t1 .row { color: var(--orange); }
.side .bar { width: 100%; height: 8px; border: 1.5px solid var(--ink); border-radius: 6px; background: rgba(255, 255, 255, 0.5); overflow: hidden; }
.side .bar i { display: block; height: 100%; transition: width 0.6s cubic-bezier(.3,1.6,.5,1); }
.side.t0 .bar i { background: var(--blue); }
.side.t1 .bar i { background: var(--orange); margin-left: auto; }
.pips { display: flex; gap: 7px; }
.pips span { width: 15px; height: 15px; transform: rotate(45deg); border: 2px solid var(--ink); border-radius: 3px; background: #fffaf0; }
.pips span.o0 { background: var(--blue); }
.pips span.flash { animation: pip 0.9s ease; }
@keyframes pip { 40% { transform: rotate(45deg) scale(1.6); box-shadow: 0 0 14px var(--gold); } }
.bump { animation: bump 0.7s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump { 30% { transform: scale(1.6) rotate(-8deg); } }

/* Turn queue: round paper tokens */
.queue { grid-area: queue; display: flex; gap: 6px; padding: 2px 2px 4px; overflow: hidden; }
.chip {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  font-size: 21px; line-height: 1;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 7px var(--team, var(--gold));
  transition: transform 0.35s cubic-bezier(.3,1.6,.5,1);
}
.chip.t0 { --team: var(--blue-wash); border-color: var(--blue); }
.chip.t1 { --team: var(--orange-wash); border-color: var(--orange); }
.chip.pulse { --team: #fbe7a8; border-color: var(--gold); }
.chip.now { transform: scale(1.12) rotate(-6deg); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 7px var(--team), 0 0 0 3px var(--ink); }

/* Board */
.board { grid-area: board; position: relative; min-height: 0; overflow: hidden; }
.board canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.board canvas:active { cursor: grabbing; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.utag {
  position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 3px;
  padding: 1px 5px 1px 3px; border-radius: 10px; border: 1.5px solid var(--ink);
  background: var(--paper); box-shadow: 1px 2px 0 rgba(59, 38, 24, 0.25);
  font-size: 12px; line-height: 1;
}
.utag i { display: block; width: 26px; height: 5px; border-radius: 3px; background: rgba(59, 38, 24, 0.15); overflow: hidden; }
.utag b { display: block; height: 100%; background: var(--team); transition: width 0.5s ease; }
.pop-at { position: absolute; left: 0; top: 0; }
.pop {
  white-space: nowrap; text-align: center;
  font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1;
  color: #fff7e8; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
  animation: pop 1.4s cubic-bezier(.2,1.4,.4,1) forwards;
}
.pop small { display: block; font-size: 13px; -webkit-text-stroke: 3.5px var(--ink); color: var(--gold); letter-spacing: 0.08em; margin-top: 1px; }
.pop.heal { color: #c9f29a; }
@keyframes pop {
  0% { margin-top: 10px; scale: 0.2; opacity: 0; }
  18% { margin-top: -18px; scale: 1.25; opacity: 1; }
  32% { scale: 1; }
  75% { opacity: 1; }
  100% { margin-top: -44px; opacity: 0; }
}
.toast {
  position: absolute; top: 10px; left: 50%; translate: -50% 0; padding: 6px 16px;
  font-family: var(--display); font-weight: 800; font-size: 16px; white-space: nowrap;
  animation: toast 2s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px) rotate(-3deg); } 15%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.label {
  position: absolute; left: 6px; top: 6px; max-width: min(260px, 70%);
  padding: 5px 10px 6px; font-size: 12px; line-height: 1.25; pointer-events: none;
}
.label b { font-family: var(--display); font-weight: 800; font-size: 12.5px; display: block; }
.label span { color: var(--ink-soft); font-style: italic; }

/* Unit card */
.panel { grid-area: panel; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.card { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
.medal {
  grid-row: span 2; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  font-size: 25px; border: 2.5px solid var(--ink); background: var(--team-wash, var(--blue-wash));
  box-shadow: inset 0 0 0 3px var(--paper);
}
.name { font-family: var(--display); font-weight: 800; font-size: 19px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; line-height: 1.1; }
.name small { font-family: var(--body); font-style: italic; font-weight: 400; font-size: 14px; color: var(--ink-soft); }
.hp { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
.hp .bar { flex: 1; height: 10px; border: 1.5px solid var(--ink); border-radius: 6px; background: rgba(255, 255, 255, 0.55); overflow: hidden; }
.hp .bar i { display: block; height: 100%; background: linear-gradient(#8fd06a, var(--leaf)); transition: width 0.6s ease; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions button {
  font: 800 15px/1 var(--display); color: var(--ink); min-height: 44px; cursor: pointer;
  background: #fffaf0; border: 2px solid var(--ink);
  border-radius: 12px 14px 11px 15px / 14px 11px 15px 12px;
  box-shadow: 2px 3px 0 rgba(59, 38, 24, 0.3);
  transition: transform 0.12s;
}
.actions button:active { transform: translate(2px, 3px); box-shadow: none; }
.actions button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.actions button.primary { background: var(--gold); }

/* Landscape: queue on the left, card on the right, like the game. */
@media (orientation: landscape) and (min-aspect-ratio: 5/4) {
  .game {
    grid-template-columns: 56px minmax(0, 1fr) minmax(240px, 30vw);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: 'queue top panel' 'queue board panel';
  }
  .queue { flex-direction: column; padding: 2px 4px; }
  .chip { width: 42px; height: 42px; font-size: 20px; }
  .panel { align-self: start; }
  .label { top: auto; bottom: 6px; }
  .actions { grid-template-columns: 1fr 1fr; }
  .actions button.primary { grid-column: span 2; }
}
@media (prefers-reduced-motion: reduce) {
  .chip, .side .bar i { transition: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="deckle"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="game">
  <header class="top paper">
    <div class="side t0"><div class="row"><span class="who">You</span><span class="pts" id="s0">3<small>/10</small></span></div><div class="bar"><i id="b0" style="width:30%"></i></div></div>
    <div class="pips"><span class="o0" id="pip0"></span><span id="pip1"></span></div>
    <div class="side t1"><div class="row"><span class="pts" id="s1">2<small>/10</small></span><span class="who">AI</span></div><div class="bar"><i id="b1" style="width:20%"></i></div></div>
  </header>
  <nav class="queue" id="queue" aria-label="Turn order"></nav>
  <main class="board" id="board">
    <div class="overlay" id="overlay"></div>
    <div class="label paper"><b>Prototype 1 · Storybook Diorama</b><span>Toon-shaded floating island, inked outlines, paper-cut HUD.</span></div>
  </main>
  <section class="panel paper" aria-label="Active unit">
    <div class="card">
      <div class="medal" id="medal">🦊</div>
      <div class="name"><span id="uname">Phase Fox</span><small id="urole">Skirmisher</small></div>
      <div class="hp"><div class="bar"><i id="uhp" style="width:100%"></i></div><span id="uhpt">82/82</span></div>
    </div>
    <div class="actions">
      <button type="button" id="btn-move">Move</button>
      <button type="button" id="btn-act">Act</button>
      <button type="button" class="primary" id="btn-end">End turn</button>
    </div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------------------
// Hex helpers (axial, pointy-top), matching the game's layout.
const S3 = Math.sqrt(3);
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const key = (q, r) => `${q},${r}`;
const hexDist = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
const LEVEL = 0.42, BASE = 0.3, FLOOR = -0.6;
const topY = (h) => BASE + h * LEVEL;
const world = (q, r) => new THREE.Vector3(S3 * (q + r / 2), 0, 1.5 * r);

let seed = 7;
const rand = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const between = (a, b) => a + rand() * (b - a);

// ---------------------------------------------------------------------------
// The map: Glass Hollow-like, with a raised rocky spine and two flank Beacons.
const ROCKS = new Set(['-1,0', '1,-1', '0,1', '-3,2', '3,-2', '-2,-2', '2,2', '-4,3'].map(String));
const ROUGH = new Set(['-2,1', '2,-3', '3,1', '-3,-1', '1,4', '-1,-4']);
const BEACONS = [{ q: -4, r: 0, owner: 0 }, { q: 4, r: 0, owner: null }];
const HILLS = new Set(['-4,2', '4,-2', '-3,4', '3,-4']);
const tiles = new Map();
for (let q = -5; q <= 5; q++) for (let r = -5; r <= 5; r++) {
  if (hexDist(q, r) > 5) continue;
  const d = hexDist(q, r);
  let h = 0;
  if (r === 0 && Math.abs(q) <= 1) h = 2;
  else if (d <= 2) h = 1;
  if (HILLS.has(key(q, r))) h = 1;
  const k = key(q, r);
  const kind = ROCKS.has(k) ? 'rock' : ROUGH.has(k) ? 'rough' : BEACONS.some((b) => b.q === q && b.r === r) ? 'beacon' : r === 5 ? 'spawn0' : r === -5 ? 'spawn1' : 'grass';
  tiles.set(k, { q, r, h, kind });
}
const tileTop = (q, r) => { const p = world(q, r); p.y = topY(tiles.get(key(q, r)).h); return p; };

// ---------------------------------------------------------------------------
// Renderer, scene, lights. The canvas is transparent: the CSS sky shows through.
const boardEl = document.getElementById('board');
const overlay = document.getElementById('overlay');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
boardEl.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffe7c4, 0x6a5878, 1.6));
const sun = new THREE.DirectionalLight(0xffd29c, 2.6);
sun.position.set(-11, 13, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -0.002;
scene.add(sun);

// ---------------------------------------------------------------------------
// Materials: three-step toon ramp, plus an inverted-hull ink outline.
const ramp = new THREE.DataTexture(new Uint8Array([95, 175, 255]), 3, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter;
ramp.needsUpdate = true;
const toonCache = new Map();
const toon = (color, extra = {}) => {
  const k = color + JSON.stringify(extra);
  if (!toonCache.has(k)) toonCache.set(k, new THREE.MeshToonMaterial({ color, gradientMap: ramp, ...extra }));
  return toonCache.get(k);
};
const basicCache = new Map();
const basic = (color) => basicCache.get(color) ?? basicCache.set(color, new THREE.MeshBasicMaterial({ color })).get(color);
const INK = new THREE.Color(0x3b2618);
const inkCache = new Map();
function inkMat(t) {
  const k = t.toFixed(4);
  if (!inkCache.has(k)) inkCache.set(k, new THREE.ShaderMaterial({
    uniforms: { t: { value: t }, c: { value: INK } },
    vertexShader: 'uniform float t; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * t, 1.0); }',
    fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.0); }',
    side: THREE.BackSide,
  }));
  return inkCache.get(k);
}
/** Ink a mesh: an outline shell `w` world units thick (scale-compensated). */
function ink(mesh, w = 0.03) {
  const s = (Math.abs(mesh.scale.x) + Math.abs(mesh.scale.y) + Math.abs(mesh.scale.z)) / 3;
  const o = new THREE.Mesh(mesh.geometry, inkMat(w / s));
  o.raycast = () => {};
  mesh.add(o);
  return o;
}

const SPH = new THREE.SphereGeometry(1, 22, 16);
const CONE = new THREE.ConeGeometry(1, 1, 14);
const CYL = new THREE.CylinderGeometry(1, 1, 1, 16);
function part(parent, geo, color, o = {}) {
  const m = new THREE.Mesh(geo, typeof color === 'object' ? color : toon(color));
  if (o.p) m.position.set(...o.p);
  if (o.s) m.scale.set(...o.s);
  if (o.r) m.rotation.set(...o.r);
  m.castShadow = o.shadow !== false;
  parent.add(m);
  if (o.ink !== false) ink(m, o.ink ?? 0.028);
  return m;
}
function eye(parent, x, y, z, s, iris = 0x2a1a12) {
  part(parent, SPH, 0xfffaf0, { p: [x, y, z], s: [s, s, s], ink: 0.016, shadow: false });
  const pupil = new THREE.Mesh(SPH, basic(iris));
  pupil.position.set(x * 1.04, y, z + s * 0.5);
  pupil.scale.setScalar(s * 0.66);
  parent.add(pupil);
  const shine = new THREE.Mesh(SPH, basic(0xffffff));
  shine.position.set(x + s * 0.18, y + s * 0.28, z + s * 1.0);
  shine.scale.setScalar(s * 0.22);
  parent.add(shine);
}

// ---------------------------------------------------------------------------
// Board: tiles with earthy strata sides and grass lips, outlines on the hex tops.
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const strata = canvasTex(64, 128, (g, w, h) => {
  const bands = ['#6f4630', '#87573a', '#a06b45', '#8c5b3c', '#b07a4f'];
  let y = 0, i = 0;
  while (y < h) {
    const bh = 10 + ((i * 37) % 17);
    g.fillStyle = bands[i % bands.length];
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= w; x += 8) g.lineTo(x, y + Math.sin(x * 0.3 + i) * 2);
    g.lineTo(w, h); g.lineTo(0, h); g.fill();
    y += bh; i++;
  }
  g.fillStyle = 'rgba(59,38,24,0.25)';
  for (let k = 0; k < 40; k++) g.fillRect((k * 23) % w, (k * 41) % h, 2, 2);
});
strata.wrapS = strata.wrapT = THREE.RepeatWrapping;

const TOP_COLORS = { 0: 0x97c35d, 1: 0xadcd62, 2: 0xc6d16c };
const sideMat = toon(0xffffff, { map: strata });
const bottomMat = toon(0x5b3a2a);
const hexOutline = (() => {
  const pts = [];
  for (let i = 0; i <= 6; i++) { const a = (Math.PI / 3) * i; pts.push(new THREE.Vector3(Math.sin(a) * 0.97, 0, Math.cos(a) * 0.97)); }
  return new THREE.BufferGeometry().setFromPoints(pts);
})();
const lineMat = new THREE.LineBasicMaterial({ color: 0x3b2618, transparent: true, opacity: 0.4 });
const LIP = new THREE.CylinderGeometry(1.0, 1.0, 0.1, 6);
const tileMeshes = [];
for (const t of tiles.values()) {
  const top = topY(t.h);
  const height = top - FLOOR;
  const geo = new THREE.CylinderGeometry(0.97, 0.97, height, 6, 1);
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) * height * 0.8);
  let topColor = TOP_COLORS[t.h];
  if (t.kind === 'rough') topColor = 0xc99a62;
  if (t.kind === 'beacon') topColor = 0xd9cbb0;
  if (t.kind === 'spawn0') topColor = 0x9cc6d6;
  if (t.kind === 'spawn1') topColor = 0xe6c08f;
  const mesh = new THREE.Mesh(geo, [sideMat, toon(topColor), bottomMat]);
  const p = world(t.q, t.r);
  mesh.position.set(p.x, FLOOR + height / 2, p.z);
  mesh.receiveShadow = true;
  scene.add(mesh);
  tileMeshes.push(mesh);
  if (t.kind !== 'rough' && t.kind !== 'beacon') {
    const lip = new THREE.Mesh(LIP, toon(t.kind.startsWith('spawn') ? topColor : 0x6fa34b));
    lip.position.set(p.x, top - 0.06, p.z);
    lip.scale.set(0.985, 1, 0.985);
    lip.receiveShadow = true;
    scene.add(lip);
  }
  const line = new THREE.LineLoop(hexOutline, lineMat);
  line.position.set(p.x, top + 0.006, p.z);
  scene.add(line);
}

// Decoration: grass tufts and flowers on grass, pebbles on rough ground, rocks.
const decor = { tufts: [], flowers: [], pebbles: [] };
for (const t of tiles.values()) {
  const c = tileTop(t.q, t.r);
  const ring = (min, max) => { const a = rand() * Math.PI * 2, d = between(min, max); return new THREE.Vector3(c.x + Math.cos(a) * d, c.y, c.z + Math.sin(a) * d); };
  if (t.kind === 'grass' || t.kind === 'rock') {
    for (let i = 0; i < 4 + Math.floor(rand() * 3); i++) decor.tufts.push(ring(0.42, 0.78));
    for (let i = 0; i < Math.floor(rand() * 3); i++) decor.flowers.push([ring(0.45, 0.75), [0xfff3f0, 0xf6a6c1, 0xf6d55c][Math.floor(rand() * 3)]]);
  }

// Reachable hexes for the fox (4 steps, avoiding rocks and units).
function reach(u, steps) {
  const occupied = new Set(Object.values(units).filter((x) => x !== u).map((x) => key(x.q, x.r)));
  const seen = new Map([[key(u.q, u.r), 0]]);
  let frontier = [[u.q, u.r]];
  for (let s = 1; s <= steps; s++) {
    const next = [];
    for (const [q, r] of frontier) for (const [dq, dr] of DIRS) {
      const k = key(q + dq, r + dr);
      const t = tiles.get(k);
      if (!t || seen.has(k) || t.kind === 'rock' || t.kind === 'beacon' || occupied.has(k)) continue;
      if (Math.abs(t.h - tiles.get(key(q, r)).h) > 2) continue;
      seen.set(k, s);
      next.push([q + dq, r + dr]);
    }
    frontier = next;
  }
  seen.delete(key(u.q, u.r));
  return [...seen.keys()].map((k) => k.split(',').map(Number));
}

// Camera: orthographic diorama view; drag to orbit, pinch or wheel to zoom.
const ELEV = THREE.MathUtils.degToRad(34);
let yaw = 0, userYaw = 0, zoom = 1, lastInput = -1e9;
const target = new THREE.Vector3(0, -0.9, 0);
function fit() {
  const w = boardEl.clientWidth || 1, h = boardEl.clientHeight || 1;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  const halfH = Math.max(8.6, 10.2 / aspect);
  camera.top = halfH; camera.bottom = -halfH;
  camera.left = -halfH * aspect; camera.right = halfH * aspect;
  camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(boardEl);
fit();
function updateCamera(t) {
  const drift = REDUCED ? 0 : Math.sin(t * 0.12) * 0.14 * Math.min(1, (now - lastInput) / 4000);
  yaw = userYaw + drift;
  const d = 40;
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(ELEV) * d, target.y + Math.sin(ELEV) * d, target.z + Math.cos(yaw) * Math.cos(ELEV) * d);
  camera.zoom = zoom;
  camera.lookAt(target);
  if (now < shakeUntil) {
    const s = ((shakeUntil - now) / 260) * 0.12;
    camera.position.x += between(-s, s);
    camera.position.y += between(-s, s);
  }

}

const pointers = new Map();
let pinch = 0;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); lastInput = now; });
canvas.addEventListener('pointermove', (e) => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  lastInput = now;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoom = THREE.MathUtils.clamp(zoom * (d / pinch), 0.8, 2.6);
    pinch = d;

canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); lastInput = now; zoom = THREE.MathUtils.clamp(zoom * Math.exp(-e.deltaY * 0.0015), 0.8, 2.6); }, { passive: false });

    tw.fn(k);

  }
  for (const u of Object.values(units)) {
    u.anim(t + u.q * 0.7, u.busy);
    u.flag.rotation.y = Math.sin(t * 3 + u.r) * 0.35;
    if (u.ringActive.visible) u.ringActive.scale.setScalar(1 + Math.sin(t * 4) * 0.05);
    project(tmp.copy(u.root.position).setY(u.root.position.y + (u.id === 'moth' ? 1.95 : 1.45)), u.tag);
  }
  for (const b of beaconViews) {
    b.crystal.rotation.y = t * 0.8;
    b.crystal.position.y = 1.15 + Math.sin(t * 1.6 + b.q) * 0.1;
    b.glow.position.y = b.crystal.position.y;
  }
  for (const c of clouds) {
    c.position.x += c.userData.speed * 0.016 * (REDUCED ? 0.3 : 1);
    if (c.position.x > 20) c.position.x = -20;
  }
  roots.forEach((r, i) => (r.rotation.z = Math.sin(t * 0.8 + i) * 0.05));
  updateCamera(t);
  for (const m of billboards) { m.quaternion.copy(camera.quaternion); if (m.userData.spin) m.rotateZ(m.userData.spin); }
  for (const p of pops) project(p.at, p.el);
  renderer.render(scene, camera);
});

renderQueue();
showCard(units.fox);
demo();
</script>
